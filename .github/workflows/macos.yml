name: macOS
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test native audio and queue
        run: scripts/test.sh
      - name: Build application and macOS installer
        run: scripts/build-installer.sh
      - uses: actions/upload-artifact@v4
        with:
          name: xonevertr-macos
          path: |
            dist/*.pkg
            dist/*.zip
          if-no-files-found: error
